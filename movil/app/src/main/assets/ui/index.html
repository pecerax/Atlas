<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Atlas</title>
<style>
/* Atlas Móvil: el HUD de Atlas reducido a lo esencial. Cielo, esfera, una frase y un botón. */
:root{
  --noche:#01040A; --a:#4FE3FF; --dim:#8FC3D6; --tenue:rgba(143,195,214,.6); --texto:#DFF7FF;
  --line:rgba(79,227,255,.22); --ok:#5FF2C0; --mal:#FF6B6B; --ambar:#FFB86B; --c:#4FE3FF;
  --sans:"Bahnschrift","Roboto Condensed","sans-serif-condensed",system-ui,sans-serif;
  --mono:"Roboto Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noche);color:var(--texto);font-family:var(--sans);font-size:17px;line-height:1.4;
  -webkit-user-select:none;user-select:none}
#fondo{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 36%,color-mix(in srgb,var(--c) 10%,#01040A),#01040A 68%);transition:--c .4s}
#cielo{position:fixed;inset:0;width:100%;height:100%;opacity:.8}
.pant{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 22px) 28px calc(env(safe-area-inset-bottom) + 22px)}
.pant.on{display:flex;animation:entra .22s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.aire{flex:1;min-height:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--a);outline-offset:4px}

.wm svg{height:44px;width:auto;display:block}
.titulo{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--tenue);padding:10px 20px}
.nucleo{width:min(82vw,48vh);aspect-ratio:1;transition:width .3s,filter .3s;animation:late 5s ease-in-out infinite;display:block}
.nucleo:active{transform:scale(.97)}
.nucleo[disabled]{pointer-events:none}
.nucleo img{width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(circle,#000 60%,transparent 70%);mask-image:radial-gradient(circle,#000 60%,transparent 70%)}
@keyframes late{50%{filter:brightness(1.18)}}
/* La esfera principal es el dibujo vivo del PC (nucleo.js): sus colores y giros los pone ese código. */
#nucleo{animation:none;filter:drop-shadow(0 0 6px rgba(79,227,255,.35))}
#nucleo svg{display:block;width:100%;height:100%;overflow:visible}
body[data-modo="escuchando"] .estado{color:#5FF2C0}
body[data-modo="hablando"] .estado{color:#FFFFFF}
body[data-modo="sinpc"] .nucleo,body[data-modo="sinpc"] #nucleo{animation:none;filter:grayscale(1) brightness(.55)}
@keyframes oye{50%{filter:brightness(1.45);transform:scale(1.03)}}
@keyframes piensa{50%{filter:brightness(1.3)}}
.estado{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--a);display:flex;align-items:center;gap:9px;margin-top:6px;min-height:34px;padding:0 14px}
.pt{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none}
body[data-modo="sinpc"] .pt{background:var(--mal);box-shadow:none}
body[data-modo="sinpc"] .estado{color:var(--tenue)}
body[data-modo="pensando"] .estado{color:#FF9F43}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:44vh;display:flex;flex-direction:column;align-items:center;
  padding:0 24px calc(env(safe-area-inset-bottom) + 14px);background:rgba(3,14,24,.94);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  transform:translateY(100%);transition:transform .24s ease-out;touch-action:none}
.hoja.hay{transform:none}
.hoja.hay.baja{transform:translateY(calc(100% - 40px - env(safe-area-inset-bottom)))}
.hoja.arrastra{transition:none}
.asa{width:100%;height:40px;flex:none;display:flex;justify-content:center;align-items:center}
.asa::before{content:"";width:46px;height:4px;border-radius:2px;background:var(--dim)}
.frases{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:4px}
.frase{text-align:center;font-size:16px;line-height:1.35;max-width:32ch;text-wrap:balance;overflow-wrap:anywhere}
.frase:empty{display:none}
.frase.yo{color:var(--tenue);font-size:13.5px}
.frase.larga{font-size:14.5px;max-width:36ch}
.aviso{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ambar);text-align:center;max-width:30ch}
.sino{display:none;gap:30px;font-weight:700;letter-spacing:.2em;font-size:15px;margin-top:4px}
.sino.on{display:flex}
.sino button{padding:12px 4px}
.sino button:first-child{color:var(--ambar);border-bottom:1px solid var(--ambar)}
.sino button+button{color:var(--tenue)}
.cab{display:flex;justify-content:space-between;align-items:center;width:100%}
.mbtn{width:48px;height:48px;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-left:-10px;padding:0 10px}
.mbtn i{display:block;height:1.5px;background:var(--dim);width:22px}.mbtn i:nth-child(2){width:15px}
.pista{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--tenue);min-height:16px;text-align:center}
#velo{position:fixed;inset:0;background:rgba(1,4,10,.6);opacity:0;pointer-events:none;transition:opacity .2s}
#menu{position:fixed;left:0;top:0;bottom:0;width:min(82vw,340px);background:rgba(1,4,10,.96);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .24s ease-out;overflow:hidden}
#menu .wm{position:absolute;left:26px;top:calc(env(safe-area-inset-top) + 26px)}
#menu .cl{position:absolute;inset:0;width:100%;height:100%}
#menu .cl line{stroke:var(--a);stroke-opacity:.22;stroke-width:1;vector-effect:non-scaling-stroke}
.es{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--k,var(--a));--s:50px;opacity:0;transition:opacity .3s}
.es.sol{--s:128px}
.es.sol .o{border:0;background:none;box-shadow:none;padding:0;filter:drop-shadow(0 0 22px rgba(79,227,255,.55))}
.es.sol b{font-size:12px;margin-top:2px}
/* los planetas (uno por app) giran alrededor del sol, cada uno a su paso, solo con el menú abierto */
.es.sol .pl{transform-origin:50px 50px;animation:orbita var(--d,40s) linear infinite;animation-delay:var(--r,0s);animation-play-state:paused}
body.menu .es.sol .pl{animation-play-state:running}
@keyframes orbita{to{transform:rotate(360deg)}}
.es .o{width:var(--s);height:var(--s);border-radius:50%;padding:calc(var(--s) * .19);display:block;border:1px solid color-mix(in srgb,var(--k,var(--a)) 42%,transparent);
  background:radial-gradient(circle,color-mix(in srgb,var(--k,var(--a)) 16%,#01040A),#01040A 78%);box-shadow:0 0 24px color-mix(in srgb,var(--k,var(--a)) 26%,transparent)}
.es:active .o{transform:scale(.94)}
.es .o svg{width:100%;height:100%;display:block}
.es b{font-size:11px;font-weight:600;letter-spacing:.24em;margin-right:-.24em}
.es small{font-family:var(--mono);font-size:10px;color:var(--tenue);letter-spacing:.06em;margin-top:-3px;white-space:nowrap}
.es small:empty{display:none}
body.menu .es{opacity:1;transition-delay:calc(var(--i,0) * 35ms + 120ms)}
#menu #btnApp{position:absolute;right:22px;top:calc(env(safe-area-inset-top) + 34px);font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ambar);border:1px solid var(--ambar);padding:10px 14px}
#menu #btnApp[hidden]{display:none}
.ver-n{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 6px);padding:12px 4px;width:100%;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--tenue)}
.mbtn.nueva i:first-child{background:var(--ambar)}
body.menu #velo{opacity:1;pointer-events:auto}
body.menu #menu{transform:none}
#escribir{display:none;width:100%;gap:8px;margin-top:10px}
#escribir.on{display:flex}
#escribir input{flex:1;height:56px;background:rgba(6,30,46,.85);border:1px solid var(--line);color:var(--texto);padding:0 14px;font:inherit;font-size:16px;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
#escribir input:focus{border-color:var(--a)}
#escribir button{width:56px;height:56px;border:1px solid var(--a);font-size:20px}

.lista{width:100%;display:flex;flex-direction:column;overflow-y:auto;flex:1;min-height:0}
.dia{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--tenue);margin:20px 0 4px}
.it{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(79,227,255,.09);font-size:16.5px;line-height:1.25}
.it time{font-family:var(--mono);font-size:11.5px;color:var(--a);flex:none;width:42px}
.it small{display:block;font-family:var(--mono);font-size:10px;color:var(--tenue);letter-spacing:.08em;margin-top:2px}
.it .pt{align-self:center;margin-left:auto}
.it.fut{color:var(--tenue)}
.it{border-left:2px solid transparent}
.it.ev{border-left-color:var(--k,var(--a));padding-left:12px;margin-top:6px;border-bottom:0;background:linear-gradient(90deg,color-mix(in srgb,var(--k,var(--a)) 9%,transparent),transparent 70%)}
.it.ev time{color:var(--k,var(--a));width:46px;line-height:1.35}
.it.ev time i{display:block;font-style:normal;color:var(--tenue);font-size:10px}
.dia b{color:var(--a);font-weight:400;margin-left:8px}
.tabs{display:none;width:100%;border:1px solid var(--line);margin:4px 0 2px}
.tabs.on{display:grid;grid-template-columns:1fr 1fr 1fr}
.tabs button{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--tenue);padding:12px 2px}
.tabs button.on{color:var(--a);background:rgba(79,227,255,.12)}
.ver{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--a);border:1px solid var(--line);padding:11px 18px}
.ver[hidden]{display:none}
/* Las apps con la estética de su pantalla en el PC: fondo teñido, rejilla, esquinas, paneles con la punta cortada,
   títulos en mono del color de la app, barras de segmentos y cifras con brillo. */
#p-app{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 10px);background:var(--abg,#01040A);
  --ap:#4FE3FF;--apanel:rgba(6,30,46,.55);--aline:rgba(79,227,255,.35);--afg:#EAF6FF;--amuted:#8FB6C8;--abien:#62F0B4;--amal:#FF8A7A}
#p-app[data-app="hermes"]{--abg:radial-gradient(ellipse at 50% 0%,#2A1806 0%,#120A03 55%,#090502 100%);--ap:#FFB86B;--apanel:rgba(38,22,8,.55);--aline:rgba(255,184,107,.35);--afg:#FFF4E8;--amuted:#C9A37C;--agrid:rgba(255,184,107,.05)}
#p-app[data-app="fortuna"]{--abg:radial-gradient(ellipse at 50% 0%,#06241D 0%,#03120E 55%,#010806 100%);--ap:#7CF0C8;--apanel:rgba(6,42,33,.55);--aline:rgba(124,240,200,.35);--afg:#E4FFF5;--amuted:#90CDB8;--agrid:rgba(124,240,200,.05);--abien:#6CB8FF;--amal:#FF6F91}
#p-app[data-app="cronos"]{--abg:radial-gradient(ellipse at 50% 0%,#1C1240 0%,#0B0720 55%,#05030C 100%);--ap:#B7A6FF;--apanel:rgba(26,18,52,.6);--aline:rgba(183,166,255,.38);--afg:#EEEAFF;--amuted:#A99BD8;--agrid:rgba(183,166,255,.06)}
#p-app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--agrid,transparent) 1px,transparent 1px),linear-gradient(90deg,var(--agrid,transparent) 1px,transparent 1px);background-size:32px 32px}
.esq{position:absolute;width:22px;height:22px;border:0 solid var(--ap);opacity:.7;pointer-events:none}
.esq.a{left:5px;top:calc(env(safe-area-inset-top) + 5px);border-left-width:2px;border-top-width:2px}.esq.b{right:5px;top:calc(env(safe-area-inset-top) + 5px);border-right-width:2px;border-top-width:2px}
.esq.c{left:5px;bottom:5px;border-left-width:2px;border-bottom-width:2px}.esq.d{right:5px;bottom:5px;border-right-width:2px;border-bottom-width:2px}
#p-app .titulo{position:relative;padding:4px 20px 10px}
.appc{color:var(--afg);position:relative;gap:10px;padding-bottom:6px}
.panel{background:var(--apanel);border:1px solid var(--aline);padding:13px 14px 14px;flex:none;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.panel::after{content:"";position:absolute;right:-1px;top:-1px;width:20px;height:20px;background:linear-gradient(45deg,transparent 49%,var(--aline) 49% 53%,transparent 53%);pointer-events:none}
.panel h3{margin:0 0 10px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ap);text-transform:uppercase}
.panel h3 span{color:var(--amuted);font-weight:400;letter-spacing:.1em;margin-left:6px}
.cifra{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ap);text-shadow:0 0 18px color-mix(in srgb,var(--ap) 55%,transparent);letter-spacing:-.01em}
.cifra.bien{color:var(--abien);text-shadow:0 0 18px color-mix(in srgb,var(--abien) 55%,transparent)}
.rot{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--amuted);text-transform:uppercase}
.rot b{font-weight:400;color:var(--abien)}.rot b.mal{color:var(--amal)}
.tramo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:10px}
.tramo .num,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.seg{height:9px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ap) 12%,transparent) 0 5px,transparent 5px 7px)}
.seg i{display:block;height:100%;background:var(--ap);max-width:100%;-webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);filter:drop-shadow(0 0 4px var(--ap))}
.seg.pas i{background:var(--amal);filter:drop-shadow(0 0 4px var(--amal))}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;font-size:15px}
.cat .seg{grid-column:1/-1;margin-top:4px}.cat small{grid-column:1/-1;font-family:var(--mono);font-size:10px;color:var(--amuted);letter-spacing:.1em}
.cat span:first-child,.mov span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mov{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--ap) 12%,transparent);font-size:14.5px}
.mov:first-of-type{border-top:0}.mov time{font-family:var(--mono);font-size:10.5px;color:var(--amuted);letter-spacing:.06em}
.mov small{grid-column:2/-1;font-family:var(--mono);font-size:10px;color:var(--amuted);letter-spacing:.08em;margin-top:-4px}
.sale{color:var(--amal)}.sube{color:var(--abien)}.baja{color:var(--amal)}
.barras{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;align-items:end;height:112px;border-bottom:1px solid var(--ap);
  background:repeating-linear-gradient(to top,transparent 0 27px,color-mix(in srgb,var(--ap) 8%,transparent) 27px 28px)}
.barras div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.barras i{display:block;width:62%;max-width:26px;background:var(--ap);opacity:.5;border-top:2px solid #FFE9D0;-webkit-mask:repeating-linear-gradient(to top,#000 0 4px,transparent 4px 6px);mask:repeating-linear-gradient(to top,#000 0 4px,transparent 4px 6px)}
.barras .act i{opacity:1;filter:drop-shadow(0 0 8px var(--ap))}
.meses{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:5px;font-family:var(--mono);font-size:9.5px;color:var(--amuted);text-align:center}
.meses .act{color:var(--ap);font-weight:700}
.pest{display:flex;border:1px solid var(--aline);background:var(--apanel);padding:3px;gap:3px;flex:none}
.pest button{flex:1;height:38px;font-size:14px;font-weight:600;color:var(--afg)}
.pest button.on{background:var(--ap);color:#04110D}
.fondo{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--ap) 12%,transparent);font-size:14.5px}
.fondo:first-of-type{border-top:0}.fondo small{font-family:var(--mono);font-size:10px;color:var(--amuted);letter-spacing:.08em}
.fondo svg{width:64px;height:20px;overflow:visible;justify-self:end}.fondo span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cini{display:flex;flex-direction:column;align-items:center;gap:14px;flex:none;padding:6px 0 10px}
.cini .clogo{width:min(40vw,170px);aspect-ratio:1;display:block;filter:drop-shadow(0 0 10px rgba(183,166,255,.55))}
.cini .clogo svg{width:100%;height:100%;display:block}
.cini p{color:var(--amuted);font-size:15px;letter-spacing:.04em}
.cal{width:100%;border:1px solid var(--aline);background:var(--apanel);padding:12px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cal .ct{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--afg);margin-bottom:8px}
.cal .ct button{color:var(--ap);font-size:18px;width:48px;height:40px}.cal .ct button:disabled{opacity:.25}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .g i{font-family:var(--mono);font-size:10px;color:var(--amuted);font-style:normal;padding-bottom:4px}
.cal .g button{font-size:14px;color:var(--afg);height:40px;border:1px solid transparent}
.cal .g button:disabled{opacity:.25}
.cal .g button.hoy{color:var(--ap);border-color:var(--aline);font-weight:700}
.cal .g button:active{background:color-mix(in srgb,var(--ap) 18%,transparent)}
.atajos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.atajos button{border:1px solid var(--aline);color:var(--afg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.16em;padding:12px 14px}
.nav{display:flex;justify-content:space-between;align-items:stretch;flex:none;border:1px solid var(--aline);background:var(--apanel);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--afg)}
.nav .dia{flex:1;width:auto;font-size:11.5px;color:var(--afg);letter-spacing:.1em;font-family:var(--mono);font-weight:700;border-left:1px solid var(--aline);border-right:1px solid var(--aline)}
.nav span{flex:1;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--aline);border-right:1px solid var(--aline);font-weight:700}
.nav button{width:52px;height:42px;font-size:18px;color:var(--ap)}.nav button:disabled{opacity:.25}
.esfera{width:min(100%,46vh);align-self:center;flex:none;display:block;margin:2px 0}
.esfera .arco{fill:none}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--amuted);flex:none}
.ley i{display:inline-block;width:8px;height:8px;margin-right:5px}
.blo{display:grid;grid-template-columns:10px 86px 1fr;gap:8px;align-items:baseline;padding:7px 0;font-size:14.5px;border-top:1px solid color-mix(in srgb,var(--ap) 12%,transparent)}
.blo:first-of-type{border-top:0}.blo i{width:9px;height:9px;display:block;align-self:center}
.blo time{font-family:var(--mono);font-size:11px;color:var(--amuted)}.blo small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--amuted);margin-left:6px}
.pie{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--amuted);text-align:center;opacity:.8;padding:6px 0 2px;flex:none;line-height:1.8}
.pie em{display:block;font-style:normal;opacity:.45;letter-spacing:.24em}
#p-app .vacio{color:var(--amuted)}
.vacio{color:var(--tenue);text-align:center;margin-top:30px;max-width:26ch;align-self:center}

/* Las apps flotan una por pantalla; se desliza a los lados y la del centro manda el color del cielo */
.aps{flex:1;min-height:0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;width:100vw;margin:0 -28px;padding:0 25vw;scrollbar-width:none;overscroll-behavior-x:contain}
.aps::-webkit-scrollbar{display:none}
body.menu .aps{overflow:hidden}
.ap{flex:none;width:50vw;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;color:var(--k);transform:scale(.6);opacity:.42;transition:transform .28s ease-out,opacity .28s}
.ap.cen{transform:none;opacity:1}
.ap .lg{width:min(46vw,34vh);aspect-ratio:1;display:block;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--k) 50%,transparent));animation:flota 5.5s ease-in-out infinite}
.ap:nth-child(even) .lg{animation-delay:-2.7s}
.ap .lg svg{width:100%;height:100%;display:block}
.ap .nm{font-size:22px}
@keyframes flota{50%{transform:translateY(-10px)}}
.apts{display:flex;gap:10px;justify-content:center;padding:18px 0 8px;flex:none}
.apts i{width:6px;height:6px;border-radius:50%;background:var(--dim);opacity:.4;transition:all .25s}
.apts i.on{opacity:1;width:20px;border-radius:3px;background:var(--k)}
.nm{font-weight:600;letter-spacing:.32em;font-size:18px;color:var(--k);white-space:nowrap}
.nm .eg{display:inline-block;vertical-align:baseline;width:.72em;height:.72em;margin-right:.3em}
.nm .eg svg{width:100%;height:100%;display:block;overflow:visible}

.portada{width:min(56vw,30vh);aspect-ratio:1;position:relative;overflow:hidden;margin-top:22px;
  background:radial-gradient(circle at 30% 28%,rgba(255,127,176,.5),transparent 55%),radial-gradient(circle at 74% 76%,rgba(183,166,255,.45),transparent 55%),#0A0612}
.portada svg{position:absolute;inset:0;width:100%;height:100%;stroke:rgba(255,255,255,.55);stroke-width:.6;fill:#fff}
.barra{width:100%;height:2px;background:color-mix(in srgb,var(--c) 22%,transparent);position:relative;margin-top:22px}
.barra i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c)}
.repro{display:flex;align-items:center;gap:30px;margin-top:20px}
.repro button{padding:14px}
.repro svg{width:24px;height:24px;fill:var(--texto);display:block}
.repro .pp svg{width:38px;height:38px;fill:var(--c)}

.accion{width:100%;height:52px;border:1px solid var(--a);font-weight:700;letter-spacing:.2em;font-size:15px;background:rgba(79,227,255,.12)}
.accion.sec{border-color:var(--line);color:var(--tenue);font-weight:400;margin-top:10px}
.avisos{width:100%;margin-top:14px}.avisos small{display:block;margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--tenue);text-align:center}
.avisos .accion.on{border-color:var(--ok);color:var(--ok)}
.accion.rojo{border-color:var(--mal);color:var(--mal);background:none}
.error{color:var(--mal);text-align:center;font-size:15px;min-height:22px;margin-top:12px;max-width:28ch}
@media (prefers-reduced-motion:reduce){.nucleo,.pant.on,.ap .lg,.es.sol .pl{animation:none!important}#menu,#velo,.hoja,.es{transition:none!important}}
</style>
</head>
<body data-modo="sinpc">
<div id="fondo"></div>
<canvas id="cielo"></canvas>

<!-- VINCULAR: la primera vez -->
<section class="pant" id="p-vincular">
  <span class="wm" data-marca></span>
  <div class="aire"></div>
  <div class="nucleo"><img alt="" src="nucleo.jpg"></div>
  <div class="aire"></div>
  <div class="frase">Vincula este celular con tu Atlas</div>
  <div class="frase yo" style="margin-top:10px">En el PC abre «Vincular celular» y escanea el código que aparece.</div>
  <div class="error" id="vincErr"></div>
  <div class="aire"></div>
  <button class="accion" id="btnEscanear">ESCANEAR CÓDIGO</button>
</section>

<!-- PRINCIPAL: la esfera es el botón. Se toca para hablar, para terminar de hablar o para detener a Atlas. -->
<section class="pant" id="p-principal">
  <div class="cab"><button class="mbtn" id="btnMenu" aria-label="Abrir el menú" aria-expanded="false"><i></i><i></i><i></i></button><span class="wm" data-marca></span><span class="mbtn" aria-hidden="true"></span></div>
  <div class="aire"></div>
  <button class="nucleo" id="nucleo" aria-label="Hablar con Atlas"></button>
  <div class="estado"><span class="pt"></span><span id="estadoTx">BUSCANDO EL PC</span></div>
  <div class="pista" id="pista"></div>
  <div class="aire"></div>
  <!-- Lo que se dijo va en una hoja que sube desde abajo; se baja con el dedo para dejar libre la esfera -->
  <div class="hoja" id="hoja">
    <button class="asa" id="asa" aria-label="Bajar o subir el texto" aria-expanded="true"></button>
    <div class="frases" id="frases">
      <div class="frase yo" id="fraseYo"></div>
      <div class="frase" id="fraseAtlas"></div>
      <div class="aviso" id="avisoPc" hidden>REINICIA ATLAS EN EL PC PARA VER EL HORARIO AQUÍ</div>
      <button class="ver" id="verVista" data-ir="vista" hidden>VER HORARIO ›</button>
      <div class="sino" id="sino"><button id="btnSi">CONFIRMAR</button><button id="btnNo">CANCELAR</button></div>
    </div>
  <form id="escribir"><input id="msg" autocomplete="off" enterkeyhint="send" placeholder="Escribe y envía…" aria-label="Mensaje para Atlas"><button type="submit" aria-label="Enviar">›</button></form>
  </div>
</section>

<!-- MENÚ lateral -->
<div id="velo"></div>
<nav id="menu" aria-label="Menú" aria-hidden="true">
  <!-- El menú es una constelación: cada destino es una estrella y el sol lleva al selector de apps. -->
  <svg class="cl" id="consLineas" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
  <span class="wm" data-marca></span>
  <button id="btnApp" hidden>ACTUALIZAR</button>
  <button class="es sol" data-menu="apps" style="left:50%;top:33%;--i:0"><span class="o"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <defs><radialGradient id="solG"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#BFF4FF"/><stop offset="1" stop-color="#4FE3FF" stop-opacity="0"/></radialGradient></defs>
    <circle cx="50" cy="50" r="20" fill="url(#solG)"/><circle cx="50" cy="50" r="9" fill="#fff"/>
    <circle cx="50" cy="50" r="30" stroke="#4FE3FF" stroke-opacity=".35" stroke-width=".6"/><circle cx="50" cy="50" r="42" stroke="#4FE3FF" stroke-opacity=".22" stroke-width=".6"/>
    <g id="solPlanetas"></g></svg></span><b>APLICACIONES</b></button>
  <button class="es" data-menu="hoy" style="left:24%;top:62%;--i:1"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="14.5" r="1.6" fill="currentColor"/></svg></span><b>HOY</b><small id="mHoy"></small></button>
  <button class="es" data-menu="escribir" style="left:76%;top:62%;--i:2"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20l1-4.5L16.5 4l3.5 3.5L8.5 19z"/><path d="M14 6.5l3.5 3.5"/></svg></span><b>ESCRIBIR</b></button>
  <button class="es" data-menu="enlace" style="left:50%;top:82%;--i:3"><span class="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4.5" width="12" height="9" rx="1"/><path d="M6 17.5h6"/><rect x="16.5" y="9" width="5" height="10.5" rx="1"/></svg></span><b>ENLACE</b><small id="mEnl"></small></button>
  <button class="ver-n" id="verN"></button>
</nav>

<!-- HOY -->
<section class="pant" id="p-hoy">
  <button class="titulo" data-ir="principal">‹ HOY</button>
  <div class="lista" id="hoyLista"></div>
</section>

<!-- VISTA: el horario o la lista que acompaña una respuesta de Atlas -->
<section class="pant" id="p-vista">
  <button class="titulo" data-ir="principal" id="vTitulo">‹ HORARIO</button>
  <div class="tabs" id="vTabs"><button data-t="eventos">EVENTOS</button><button data-t="clases">CLASES</button><button data-t="ambos">AMBOS</button></div>
  <div class="lista" id="vLista"></div>
</section>

<!-- APPS -->
<section class="pant" id="p-apps">
  <button class="titulo" data-ir="principal">‹ APPS</button>
  <div class="aps" id="aps"></div>
  <div class="apts" id="apts"></div>
</section>

<!-- BACO: lo que suena en el PC -->
<section class="pant" id="p-baco">
  <button class="titulo" data-ir="apps" style="letter-spacing:0"><span class="nm" data-nm="baco" style="font-size:20px"></span></button>
  <div class="portada"><svg viewBox="0 0 150 150" aria-hidden="true"><path d="M30 104 L58 62 L92 84 L118 40" fill="none"/><circle cx="30" cy="104" r="2.2"/><circle cx="58" cy="62" r="3"/><circle cx="92" cy="84" r="2.2"/><circle cx="118" cy="40" r="3.4"/><circle cx="74" cy="118" r="1.2"/><circle cx="24" cy="38" r="1.2"/><circle cx="128" cy="110" r="1.4"/></svg></div>
  <div class="frase" id="mTitulo" style="margin-top:22px;font-weight:600">Nada suena en el PC</div>
  <div class="frase yo" id="mArtista"></div>
  <div class="barra"><i id="mBarra"></i></div>
  <div class="repro">
    <button data-m="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button data-m="toggle" class="pp" aria-label="Pausar o seguir"><svg viewBox="0 0 24 24" id="mIcono"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button data-m="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
</section>

<!-- UNA APP QUE AÚN VIVE SOLO EN EL PC -->
<section class="pant" id="p-app">
  <button class="titulo" data-ir="apps" style="letter-spacing:0"><span class="nm" id="appNm" style="font-size:20px"></span></button>
  <i class="esq a"></i><i class="esq b"></i><i class="esq c"></i><i class="esq d"></i>
  <div class="lista appc" id="appCaja"></div>
</section>

<!-- ENLACE -->
<section class="pant" id="p-enlace">
  <button class="titulo" data-ir="principal">‹ ENLACE</button>
  <div class="lista" id="enlLista" style="flex:none"></div>
  <div class="avisos" id="avisosCaja" hidden>
    <button class="accion sec" id="btnAvisos">AVISAR AL PC DE MENSAJES Y LLAMADAS</button>
    <small id="avisosTx"></small>
  </div>
  <div class="aire"></div>
  <button class="accion rojo" id="btnDesv">DESVINCULAR ESTE CELULAR</button>
</section>

<script src="logos.js"></script>
<script src="app.js"></script>
<script src="nucleo.js"></script>
</body>
</html>
