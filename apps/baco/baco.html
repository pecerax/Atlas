<style>
/* Baco (entretenimiento). 18-11-2026: diseño «Paneles». 19-11-2026: escenario del favorito, carátulas, Ahora suena con portada,
   playlists, noticias con selector, Para ti, perfil y Lo que viene con todo tipo de eventos. Fondo carta celeste de siempre. */
:root{
  --bg:#01040A; --panel:rgba(30,8,20,.55); --panel-2:rgba(14,4,10,.82); --fg:#EAF6FF; --fg-2:#F6D4E2; --muted:#8FA9B8;
  --accent:#FF7FB0; --accent-soft:rgba(255,127,176,.14); --line:rgba(255,127,176,.35); --grid:rgba(255,127,176,.12);
  --good:#62F0B4; --warn:#F5E26B; --cyan:#4FE3FF; --bad:#FF6B6B;
  --f-body:"Bahnschrift","Segoe UI",system-ui,sans-serif; --f-mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(255,127,176,.10) 0%,#03070F 55%,#01040A 100%) fixed,var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.hud-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,127,176,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,127,176,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}
.corner{position:fixed;width:30px;height:30px;border:0 solid var(--accent);pointer-events:none;z-index:1;opacity:.7}
.c-tl{left:8px;top:8px;border-left-width:2px;border-top-width:2px}.c-tr{right:8px;top:8px;border-right-width:2px;border-top-width:2px}
.c-bl{left:8px;bottom:8px;border-left-width:2px;border-bottom-width:2px}.c-br{right:8px;bottom:8px;border-right-width:2px;border-bottom-width:2px}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:rgba(14,4,10,.35);border:1px solid var(--line);box-shadow:inset 0 0 30px rgba(255,127,176,.04);padding:14px 16px;min-width:0}
h2{margin:0 0 10px;font-size:.78rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
h2 .r{margin-left:auto;color:var(--muted)}

/* marca */
.brand{display:flex;align-items:center;gap:10px}
.brand .lg{width:34px;height:34px;color:var(--accent);filter:drop-shadow(0 0 8px rgba(255,127,176,.4))}.brand .lg svg{width:100%;height:100%;display:block}
.brand b{font-size:1.15rem;font-weight:600;letter-spacing:.22em;color:var(--accent);display:inline-flex;align-items:center}
.brand b .eg{display:inline-block;width:.72em;height:.72em;margin:0 .22em 0 .02em;color:var(--accent)}.brand b .eg svg{width:100%;height:100%;display:block}
.clock{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;color:var(--muted)}
.wrap{position:relative;z-index:2;max-width:1360px;margin:0 auto;padding:14px 24px 26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top .grow{flex:1}

/* portadas: imagen real o iniciales sobre un color */
.cov{position:relative;display:grid;place-items:center;overflow:hidden;background:var(--c1,#3a1a2a);color:#fff;font-family:var(--f-mono);font-weight:500;letter-spacing:.1em;flex:none}
.cov::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.25),transparent 55%),linear-gradient(135deg,transparent 40%,rgba(0,0,0,.55))}
.cov span{position:relative;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.plat{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plat i{width:7px;height:7px;border-radius:50%;background:var(--pc);box-shadow:0 0 6px var(--pc)}

.pin{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;flex:none}
.pin svg{width:15px;height:15px}
.pin:hover{color:var(--accent);border-color:var(--grid)}
.pin[aria-pressed="true"]{color:var(--accent);filter:drop-shadow(0 0 6px rgba(255,127,176,.7))}
.pin:focus-visible{outline:2px solid var(--accent)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);background:rgba(14,4,10,.7);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#01040A;border-color:var(--accent);font-weight:600;box-shadow:0 0 14px rgba(255,127,176,.35)}
.btn.pri:hover{color:#01040A;box-shadow:0 0 20px rgba(255,127,176,.6)}
.btn.ok{border-color:rgba(98,240,180,.5);color:var(--good)}.btn.ok:hover{background:rgba(98,240,180,.12)}
.btn.bad{border-color:rgba(255,107,107,.5);color:var(--bad)}.btn.bad:hover{background:rgba(255,107,107,.12)}
.btn.star-b[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.btn:focus-visible{outline:2px solid var(--accent)}
.btn.sm{padding:2px 8px;font-size:.64rem}
.prog{height:4px;background:repeating-linear-gradient(90deg,rgba(255,127,176,.14) 0 5px,transparent 5px 7px);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--accent);filter:drop-shadow(0 0 4px rgba(255,127,176,.8));-webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.flash{animation:fl .7s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 rgba(98,240,180,0)}30%{box-shadow:0 0 26px rgba(98,240,180,.6)}100%{box-shadow:0 0 0 rgba(98,240,180,0)}}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:2px 9px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.tabpin{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:2px 6px;border:1px solid transparent}
.tabpin svg{width:12px;height:12px}
.tabpin:hover{color:var(--accent);border-color:var(--grid)}
.tabpin[aria-pressed="true"]{color:var(--accent)}
.tabpin:focus-visible{outline:2px solid var(--accent)}
.vacio{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;color:var(--muted);padding:14px 4px;line-height:1.6}
.vacio .btn{margin-top:8px}

/* disposición (19-11-2026): escenario · carátulas | ahora suena y enlaces · noticias | para ti · lo que viene.
   El fondo de siempre (carta celeste y cuadrícula) queda a la vista: los paneles son de vidrio. */
.lay{display:flex;flex-direction:column;gap:26px}
.mid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px}
.low{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:26px}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.open{min-width:0}
.lbl-line{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lbl-line::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.lbl-line .r{order:2;color:var(--muted);font-size:.68rem;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lbl-line .r .btn{text-transform:none;letter-spacing:.06em}
.legend{display:inline-flex;gap:6px;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;flex-wrap:wrap}
.legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:1px 6px;border:1px solid transparent}
.legend button i{width:8px;height:8px;border-radius:50%;background:var(--kc);box-shadow:0 0 6px var(--kc)}
.legend button[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.legend button:hover{border-color:var(--grid)}
.legend button:focus-visible{outline:2px solid var(--accent)}

/* 1 · escenario del favorito */
.stage{position:relative;min-height:330px;display:grid;grid-template-columns:minmax(0,1fr) auto;border:1px solid var(--line);overflow:hidden;background:rgba(14,4,10,.4);box-shadow:0 0 40px rgba(255,127,176,.12)}
.stage .fondo{position:absolute;inset:0;background:var(--c1,#3a1a2a);opacity:.75}
.stage .fondo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0;transition:opacity .5s}
.stage .fondo img.ok{opacity:1}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(1,4,10,.96) 0%,rgba(1,4,10,.82) 36%,rgba(1,4,10,.25) 70%,rgba(1,4,10,.5) 100%),linear-gradient(0deg,rgba(1,4,10,.85),transparent 45%)}
.stage .bd{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;padding:24px 28px;max-width:640px;min-width:0;justify-content:flex-end}
.stage .lbl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage .lbl>span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);padding:2px 8px;color:var(--accent);background:rgba(1,4,10,.5)}
.stage .lbl>span.prev{color:var(--fg-2);border-color:var(--grid)}
.stage .meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stage .ti{font-size:2.6rem;font-weight:700;letter-spacing:.02em;line-height:1;overflow-wrap:anywhere;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.stage .syn{margin:0;color:var(--fg-2);font-size:.92rem;max-width:62ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stage .syn.full{display:block;-webkit-line-clamp:unset}
.stage .ep{font-family:var(--f-mono);font-size:.86rem;color:var(--fg-2)}.stage .ep b{color:var(--accent);font-weight:500}
.stage .s{font-size:.8rem;color:var(--muted)}
.stage .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.stage .act .btn{background:rgba(1,4,10,.6)}.stage .act .btn.pri{background:var(--accent)}
.stage .prog{max-width:320px}
.stage .sw{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.stage .sw button{all:unset;cursor:pointer;width:38px;height:38px;opacity:.6;border:1px solid transparent}
.stage .sw button .cov{width:100%;height:100%;font-size:.55rem}
.stage .sw button:hover,.stage .sw button[aria-pressed="true"],.stage .sw button:focus-visible{opacity:1;border-color:var(--accent)}
.stage .next{position:relative;z-index:1;align-self:end;margin:0 24px 24px;width:270px;display:flex;flex-direction:column;gap:7px;padding:12px;background:rgba(10,4,10,.72);border:1px solid var(--line);backdrop-filter:blur(6px)}
.stage .next .k{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.stage .next b{font-weight:600}
.stage .next .big{font-family:var(--f-mono);font-size:2.4rem;line-height:1;color:var(--cyan);text-shadow:0 0 14px rgba(79,227,255,.5)}
.stage .next small{color:var(--muted);font-size:.78rem}
.stage .pistas{display:flex;flex-direction:column;max-width:460px}
.stage .pistas button{all:unset;cursor:pointer;display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--grid);font-size:.88rem}
.stage .pistas button small{color:var(--muted)}
.stage .pistas button:hover b{color:var(--accent)}
.stage .pistas button:focus-visible{outline:2px solid var(--accent)}
.stage.flash{animation:fl .7s ease-out}
.stage.nada{grid-template-columns:minmax(0,1fr);min-height:200px}

/* 2 · carátulas */
.tabs-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tabs-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);order:3}
.tabs-h .r{order:4;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(255,127,176,.6) rgba(255,127,176,.07)}
.shelf::-webkit-scrollbar{height:9px}.shelf::-webkit-scrollbar-track{background:rgba(255,127,176,.07)}
.shelf::-webkit-scrollbar-thumb{background:rgba(255,127,176,.55);border:2px solid transparent;background-clip:padding-box}
.pst{all:unset;cursor:pointer;flex:none;width:138px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;position:relative}
.pst .cov{width:138px;height:207px;font-size:1.6rem;border:1px solid var(--grid);transition:transform .2s,box-shadow .2s,border-color .2s}

      if (pq.tipo === "nada" && antes.startsWith("subida:")) api("portada_pl", { id: m.id, quitar: true }).catch(() => {});
      if (pq.tipo === "cancion" || pq.tipo === "datos") (async () => {   // la imagen se guarda en el PC y la playlist apunta a ella
        try { const r = await api("portada_pl", pq.tipo === "cancion" ? { id: m.id, t: pq.p.t, a: pq.p.a || "" } : { id: m.id, datos: pq.datos });
          if (!r.ok) { toast(r.error || "No se pudo guardar la portada"); return; }
          m.img = r.img; await guardar({ musica: S.musica }); render();
        } catch (e) { toast("No se pudo guardar la portada: " + e.message); }
      })(); },
    nuevo ? null : () => { S.musica = S.musica.filter(x => x.id !== m.id); S.fijados = S.fijados.filter(i => i !== m.id); quitarFav(m.id); guardar({ musica: S.musica, fijados: S.fijados, favoritos: S.favoritos }); }, true);
  pintar();
  $("#dPg").onclick = ev => { const b = ev.target.closest("[data-pc]"); if (b) { port = { tipo: "cancion", p: P[+b.dataset.pc] }; pintarPort(); } };
  $("#dPno").onclick = () => { port = { tipo: "nada" }; pintarPort(); };
  $("#dPurl").onclick = () => { $("#dPu").hidden = !$("#dPu").hidden; if (!$("#dPu").hidden) $("#dPui").focus(); };
  const usarUrl = () => { const u = limpiaUrl($("#dPui").value); if (!/^https:\/\/[^\s"'<>]+$/i.test(u)) { $("#dErr").textContent = "Pega el enlace (https://…) de una imagen."; $("#dPui").focus(); return; } $("#dErr").textContent = ""; port = { tipo: "url", u }; pintarPort(); };
  $("#dPuok").onclick = usarUrl;
  $("#dPui").addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); usarUrl(); } });
  $("#dPsub").onclick = () => $("#dPf").click();
  $("#dPf").onchange = () => {   // la achico a 480 px en JPEG para no guardar fotos enormes
    const f = $("#dPf").files[0]; if (!f) return;
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => { const k = Math.min(1, 480 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      port = { tipo: "datos", datos: c.toDataURL("image/jpeg", .86) }; $("#dErr").textContent = ""; pintarPort(); };
    im.onerror = () => { URL.revokeObjectURL(url); $("#dErr").textContent = "Esa imagen no se pudo abrir."; };
    im.src = url; $("#dPf").value = "";
  };
  F.t.addEventListener("input", () => { if (port.tipo === "nada") pintarPort(); });
  $("#dTrk").onclick = ev => { const b = ev.target.closest("[data-q]"); if (b) { P.splice(+b.dataset.q, 1); pintar(); } };
  const agregar = L => { let n = 0; for (const p of L) if (!P.some(q => !esLista(q) && norm(q.t) === norm(p.t) && norm(q.a) === norm(p.a))) { P.push({ t: p.t, a: p.a || "", ...(p.u ? { u: p.u } : {}) }); n++; } pintar(); $("#dErr").textContent = n ? "" : "No hay canciones nuevas para agregar."; };
  const desde = async seg => { try { const r = await api("sonado"); SONADO = r.res || []; } catch (_) {} agregar(SONADO.filter(x => x.ts >= Date.now() / 1000 - seg).reverse()); };
  $("#dHoy").onclick = () => { const h = new Date(); h.setHours(0, 0, 0, 0); desde((Date.now() - h) / 1000); };
  $("#dSemana").onclick = () => desde(7 * 86400);
  $("#dAddU").onclick = () => {
    const u = limpiaUrl(F._u.value); if (!/^https:\/\/(music\.|www\.|m\.)?youtube\.com\/|^https:\/\/youtu\.be\/|^https:\/\/open\.spotify\.com\/|^spotify:/.test(u)) { $("#dErr").textContent = "Pega un enlace de YouTube Music o Spotify."; F._u.focus(); return; }
    const q = { u, a: "" }, f = fuenteDe(q), lista = esLista(q);
    P.push({ t: F._n.value.trim() || (lista ? "Playlist de " + f : "Canción de " + f), a: "", u }); F._u.value = ""; F._n.value = ""; $("#dErr").textContent = ""; pintar();
  };
  [F._u, F._n].forEach(i => i.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); $("#dAddU").click(); } }));
  $("#dAdd").onclick = () => { const t = F._t.value.trim(); if (!t) { F._t.focus(); return; } agregar([{ t, a: F._a.value.trim() }]); F._t.value = ""; F._a.value = ""; F._t.focus(); };
  [F._t, F._a].forEach(i => i.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); $("#dAdd").click(); } }));
}
function dlgGuardarSuena() {
  if (!M.hay || !M.titulo) { toast("No hay nada sonando."); return; }
  const p = { t: M.titulo, a: M.artista || "", ...(M.u ? { u: M.u } : {}) };   // u: el video exacto que sonaba en la ventana de música de Atlas
  const L = ordenar(musica());   // cualquier playlist, aunque haya partido como enlace
  abrirDlg(`<h3>Guardar «${esc(p.t)}»</h3><div class="ayuda">${esc(p.a)}</div><div class="res" id="dRes">${L.map(x => `<button type="button" data-id="${esc(x.id)}">${cov(x)}<span style="min-width:0"><b>${esc(x.t)}</b><small>${(x.pistas || []).length} canciones</small></span></button>`).join("")}<button type="button" data-id=""><span class="cov" style="--c1:var(--accent-soft)"><span>+</span></span><span><b>Nueva playlist</b><small>con esta canción</small></span></button></div>`, () => "Elige una playlist.");
  F.querySelector("[type=submit]").style.display = "none";
  $("#dRes").onclick = ev => {
    const b = ev.target.closest("[data-id]"); if (!b) return;
    if (!b.dataset.id) { dlg.close(); dlgMusica(null, p); return; }
    const x = S.musica.find(y => y.id === b.dataset.id); x.pistas = x.pistas || [];
    if (x.u) { if (!x.pistas.some(q => q.u === x.u)) x.pistas.unshift({ t: x.t, a: "", u: x.u }); x.u = ""; }   // el enlace pasa a ser la primera parte de la cola
    const ya = x.pistas.find(q => !esLista(q) && norm(q.t) === norm(p.t) && norm(q.a) === norm(p.a));
    if (!ya) x.pistas.push(p); else if (p.u && !ya.u) ya.u = p.u;   // si ya estaba, queda con la versión exacta
    guardar({ musica: S.musica }); dlg.close(); render(); toast(`Guardada en «${x.t}»`);
  };
}
function dlgEnlace(l) {
  const nuevo = !l; l = l || { id: nid(), t: "", u: "" };
  abrirDlg(`<h3>${nuevo ? "Agregar enlace" : "Editar enlace"}</h3>${campo("t", "Nombre", l.t, "required maxlength=60")}${campo("u", "Dirección", l.u, "required placeholder=\"https://…\"")}<div class="ayuda">Se abre en Firefox.</div>`,
    v => { const t = v.t.trim(); if (!t) return "Falta el nombre."; const u = limpiaUrl(v.u); if (!u || !okUrl(u)) return "Falta una dirección válida.";
      Object.assign(l, { t, u }); if (nuevo) S.enlaces.push(l); guardar({ enlaces: S.enlaces }); },
    nuevo ? null : () => { S.enlaces = S.enlaces.filter(x => x.id !== l.id); S.fijados = S.fijados.filter(i => i !== l.id); guardar({ enlaces: S.enlaces, fijados: S.fijados }); });
}
function dlgEspera(x) {
  const nuevo = !x; x = x || { id: nid(), t: "", f: "", k: "c", s: "", u: "" };
  const k = x.k === "e" ? "s" : x.k;
  const tipos = [["c", "Concierto"], ["v", "Evento (festival, torneo, feria…)"], ["s", "Estreno de serie"], ["j", "Salida de un juego"], ["p", "Película"]];
  abrirDlg(`<h3>${nuevo ? "Agregar fecha" : "Editar fecha"}</h3>${campo("t", "Qué", x.t, "required maxlength=120 placeholder=\"Artista, evento o título\"")}
  <div class="fila2"><label>Tipo<select name="k">${tipos.map(([v, n]) => `<option value="${v}" ${k === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>${campo("f", "Fecha", x.f, "type=date required")}</div>
  ${campo("s", "Detalle (opcional)", x.s, "maxlength=120 placeholder=\"Lugar, plataforma…\"")}${campo("u", "Enlace (opcional)", x.u || "", "placeholder=\"https://… (entradas, ficha)\"")}`,
    v => { const t = v.t.trim(); if (!t) return "Falta el nombre."; if (!/^\d{4}-\d{2}-\d{2}$/.test(v.f)) return "Falta la fecha."; const u = limpiaUrl(v.u); if (!okUrl(u)) return "El enlace no parece válido.";
      Object.assign(x, { t, f: v.f, k: v.k, s: v.s.trim(), u }); if (nuevo) S.esperas.push(x); guardar({ esperas: S.esperas }).then(cargarNoticias); },
    nuevo ? null : () => { S.esperas = S.esperas.filter(e => e.id !== x.id); guardar({ esperas: S.esperas }); });
}

/* perfil: unas preguntas cortas para saber qué mostrar */
const ETQ = { "anime": "Anime", "drama": "Drama", "comedia": "Comedia", "ciencia ficcion": "Ciencia ficción", "fantasia": "Fantasía", "terror": "Terror", "policial": "Policial", "documentales": "Documentales", "animacion": "Animación", "accion": "Acción", "reality": "Reality",
  "netflix": "Netflix", "disney": "Disney+", "max": "Max", "prime": "Prime Video", "apple": "Apple TV+", "crunchy": "Crunchyroll", "paramount": "Paramount+", "youtube": "YouTube",
  "rpg": "RPG", "shooter": "Shooter", "mundo abierto": "Mundo abierto", "estrategia": "Estrategia", "deportes": "Deportes", "indie": "Indie", "gacha": "Gacha", "moba": "MOBA", "carreras": "Carreras", "pelea": "Pelea",
  "pc": "PC", "ps5": "PS5", "xbox": "Xbox", "switch": "Switch", "celular": "Celular",
  "pop": "Pop", "rock": "Rock", "urbano": "Urbano", "electronica": "Electrónica", "hip hop": "Hip hop", "metal": "Metal", "kpop": "K-pop", "latino": "Latino", "bandas sonoras": "Bandas sonoras", "jazz": "Jazz" };
function dlgPerfil() {
  const P = S.perfil, O = S.perfil_opciones;
  const grupo = (k, q) => `<div class="q">${q}</div><div class="chips" role="group" aria-label="${esc(q)}">${O[k].map(v => `<label class="chipc"><input type="checkbox" name="${k}" value="${esc(v)}" ${P[k].includes(v) ? "checked" : ""}>${esc(ETQ[v] || v)}</label>`).join("")}</div>`;
  abrirDlg(`<h3>Tu perfil en Baco</h3><div class="ayuda">Con esto Baco elige noticias, recomendaciones y eventos para ti. Puedes cambiarlo cuando quieras desde «⚙ Tu perfil».</div>
  ${grupo("ver", "¿Qué te gusta ver?")}${grupo("donde", "¿Dónde ves series?")}${grupo("jugar", "¿Qué te gusta jugar?")}${grupo("consolas", "¿En qué juegas?")}${grupo("musica", "¿Qué música escuchas?")}
  ${campo("artistas", "Artistas que más escuchas (separados por coma)", P.artistas.join(", "), "maxlength=600 placeholder=\"Tame Impala, Bad Bunny, M83\"")}
  ${campo("ciudad", "Tu ciudad (para conciertos y eventos)", P.ciudad || "Santiago", "maxlength=60")}
  ${S.pt_disponible ? `<div class="q">Cartelera</div><div class="chips"><label class="chipc"><input type="checkbox" name="pt" ${P.pt !== false ? "checked" : ""}>Eventos de PuntoTicket</label></div><div class="ayuda">Baco revisa su cartelera pública una vez al día, solo para ti.</div>` : ""}`,
    v => {
      const p = { listo: true, artistas: v.artistas.split(",").map(a => a.trim()).filter(Boolean).slice(0, 20), ciudad: v.ciudad.trim(), pt: S.pt_disponible ? !!F.querySelector('[name="pt"]:checked') : P.pt !== false, ...(P.eventos ? { eventos: P.eventos } : {}) };
      for (const k of Object.keys(O)) p[k] = [...F.querySelectorAll(`[name="${k}"]:checked`)].map(i => i.value);
      S.perfil = p; guardar({ perfil: p }).then(() => { cargarDescubrir(true); cargarNoticias(); cargarEventos(); });
      toast("Listo: Baco ya sabe qué te gusta");
    }, null, "perfil");
}

/* ---------- arranque */
async function cargarEsperados() {
  if (!S.claves.igdb || !S.esperados.length) return;
  try { const r = await api("igdb/esperados"); if (r.ok) { ESP = {}; for (const [k, v] of Object.entries(r.juegos)) ESP[k] = v; renderPronto(); } } catch (_) {}
}
async function cargarEstrenos() {
  if (!S.claves.tmdb && !S.claves.igdb) { estrenos = []; return; }
  try { const r = await api("estrenos"); estrenos = r.ok ? r.ev.filter((e, i, L) => L.findIndex(o => o.id === e.id) === i) : []; } catch (_) { estrenos = []; }
  renderPronto();
}
async function cargarEventos() {
  try { const r = await api("eventos"); eventosG = r.ok ? r.ev : []; eventosPT = r.pt || null; EV_SIGUE = r.sigue || []; EV_SUBS = r.subcats || {}; } catch (_) { eventosG = []; }
  renderPronto();
}
async function iniciar() {
  try { S = await api("estado"); }
  catch (_) { $("#view").innerHTML = `<div class="aviso"><b>BACO</b>Abre Baco desde Atlas: sus datos los entrega el servidor de Atlas en este PC.</div>`; return; }
  tab = S.pestana === "juego" ? "juego" : "serie";
  S.favoritos = { serie: "", juego: "", musica: "", ...(S.favoritos || {}) };
  if (S.favorito && porId(S.favorito) && !favs().length) { S.favoritos[ranura(porId(S.favorito))] = S.favorito; guardar({ favoritos: S.favoritos }); }   // venía con un solo favorito
  render(); sondearMedia(); sondearEspectro(); requestAnimationFrame(pasoEspectro); cargarEstrenos(); cargarEsperados(); cargarEventos(); cargarNoticias(); cargarDescubrir();
  if (!S.perfil.listo) setTimeout(() => { if (!dlg.open) dlgPerfil(); }, 700);
  setInterval(async () => { if (document.hidden) return; try { const j = await api("juegos"); S.steam = { ok: j.ok, juegos: j.juegos, error: j.error }; S.pc = j.pc; renderPronto(); } catch (_) {} }, 60000);
  setInterval(() => { if (!document.hidden) cargarNoticias(); }, 30 * 60000);
}
iniciar();
</script>
<script>/* dentro de Atlas: Escape cierra Baco (si no hay un diálogo abierto) */

  if (!location.pathname.startsWith("/acceso/")) return;
  addEventListener("keydown", (e) => { if (e.key === "Escape" && parent !== window && !document.querySelector("dialog[open]")) parent.postMessage({ atlas: 1, type: "cerrar" }, location.origin); });
