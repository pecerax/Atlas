<style>
/* Atenea (aprendizaje), 18-11-2026: pantalla inicial «próximamente». Acento #C8E07A, fondo carta celeste (PEGASO). */
:root{--bg:#01040A;--fg:#EAF6FF;--muted:#8FA9B8;--accent:#C8E07A;--line:rgba(200,224,122,.35);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(200,224,122,.10) 0%,#03070F 55%,#01040A 100%) fixed,var(--bg);color:var(--fg);
 font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif;overflow:hidden}
.hud-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(200,224,122,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(200,224,122,.05) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}

.tl{left:8px;top:8px;border-left-width:2px;border-top-width:2px}.tr{right:8px;top:8px;border-right-width:2px;border-top-width:2px}
.bl{left:8px;bottom:8px;border-left-width:2px;border-bottom-width:2px}.br{right:8px;bottom:8px;border-right-width:2px;border-bottom-width:2px}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 16px;text-align:center}
.logo{width:min(220px,40vw);height:auto;color:var(--accent);filter:drop-shadow(0 0 18px rgba(200,224,122,.45))}
h1{margin:0;font-weight:600;font-size:clamp(28px,5vw,44px);letter-spacing:.3em;text-indent:.3em;color:var(--accent);text-shadow:0 0 18px rgba(200,224,122,.35);display:flex;align-items:center;justify-content:center}
h1 .eg{display:inline-block;width:.72em;height:.72em;margin-right:.16em;color:var(--accent)}
h1 .eg svg{width:100%;height:100%;display:block}
.sub{font:12px Consolas,"Cascadia Mono",monospace;letter-spacing:.4em;text-indent:.4em;color:var(--muted)}
.pronto{margin-top:14px;padding:8px 18px;border:1px solid var(--line);font:13px Consolas,"Cascadia Mono",monospace;letter-spacing:.34em;text-indent:.34em;color:var(--accent);background:rgba(200,224,122,.06)}
p{margin:0;max-width:34em;color:var(--muted);font-size:15px;line-height:1.5}

<script>/* fondo carta celeste con constelación propia (copia del de Fortuna) */

  window.cieloApp = function (o) {
    const cv = document.createElement("canvas"); cv.id = "cieloApp"; cv.setAttribute("aria-hidden", "true");

        g.fillStyle = t < .3 ? `rgba(${rgb},${a})` : `rgba(235,248,255,${a})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

      // la constelación de la app, tenue, en el tercio derecho
      const c = C[o.cons], xs = c.s.map((s) => -s[0]), ys = c.s.map((s) => -s[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

      const k = Math.min(box.w / Math.max(1, x1 - x0), box.h / Math.max(1, y1 - y0));
      const P = c.s.map(([ra, de, m]) => [box.x + box.w / 2 + (-ra - (x0 + x1) / 2) * k, box.y + box.h / 2 + (-de - (y0 + y1) / 2) * k, m]);
