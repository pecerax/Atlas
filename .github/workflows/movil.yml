name: Atlas Móvil

on:
  push:
    paths:
      - "movil/**"
      - "hud/atlas_puente.py"
      - "hud/pruebas_puente.py"
      - ".github/workflows/movil.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puente:
    name: Pruebas del Puente Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography==50.0.2
      - run: python hud/pruebas_puente.py

  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el número de la interfaz es la cantidad de cambios que ha tenido su carpeta
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Con la llave de firma guardada en los secretos del repositorio, cada versión se instala sobre la anterior.
      - name: Llave de firma (si está configurada)
        env:
          LLAVE: ${{ secrets.ATLAS_KEYSTORE_B64 }}
          CLAVE: ${{ secrets.ATLAS_KEYSTORE_CLAVE }}
        run: |
          if [ -z "$LLAVE" ]; then echo "Sin llave: se usa la firma de prueba."; exit 0; fi
          # Al pegar los secretos suelen colarse saltos de línea o espacios: se quitan antes de usarlos.
          printf '%s' "$LLAVE" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/atlas.jks" \
            || { echo "::error::ATLAS_KEYSTORE_B64 no es base64 válido (¿se pegó incompleto?)."; exit 1; }
          echo "Llave: $(printf '%s' "$LLAVE" | tr -d ' \r\n\t' | wc -c) caracteres, $(stat -c %s "$RUNNER_TEMP/atlas.jks") bytes."
          CLAVE="$(printf '%s' "$CLAVE" | tr -d '\r\n\t ')"
          if [ -z "$CLAVE" ]; then echo "::error::Falta el secreto ATLAS_KEYSTORE_CLAVE."; exit 1; fi
          if ! keytool -list -v -keystore "$RUNNER_TEMP/atlas.jks" -storepass:env CLAVE -alias atlas > "$RUNNER_TEMP/llave.txt" 2>&1; then
            echo "::error::ATLAS_KEYSTORE_CLAVE no abre la llave: la clave guardada no corresponde a este archivo."
            exit 1
          fi
          grep -m1 "SHA256:" "$RUNNER_TEMP/llave.txt"
          echo "::add-mask::$CLAVE"
          echo "ATLAS_KEYSTORE=$RUNNER_TEMP/atlas.jks" >> "$GITHUB_ENV"
          echo "ATLAS_KEYSTORE_CLAVE=$CLAVE" >> "$GITHUB_ENV"
      # La interfaz lleva un número que solo sube; el mismo queda dentro del APK y dentro del paquete que la app baja sola.
      - name: Numerar la interfaz
        run: |
          UI=movil/app/src/main/assets/ui
          N=$(git rev-list --count HEAD -- "$UI")
          MIN=$(python3 -c "import json;print(int(json.load(open('$UI/version.json'))['min_app']))")
          echo "{\"n\": $N, \"min_app\": $MIN}" > "$UI/version.json"
          V=$(tr -d '[:space:]' < movil/VERSION)
          echo "$V" | grep -Eq '^1\.[0-9]+\.[0-9]+$'
          sed -i "s/@ATLAS_V@/$V/" "$UI/app.js"; grep -q "\"$V\"" "$UI/app.js"
          echo "UI_N=$N" >> "$GITHUB_ENV"; echo "UI_MIN=$MIN" >> "$GITHUB_ENV"
          cat "$UI/version.json"
      - name: Compilar
        # Con la llave fija sale la versión final (no depurable). Sin llave solo se puede firmar la de prueba.
        run: |
          if [ -n "$ATLAS_KEYSTORE" ]; then
            gradle -p movil assembleRelease --no-daemon --stacktrace
            cp movil/app/build/outputs/apk/release/app-release.apk Atlas-Movil.apk
          else
            gradle -p movil assembleDebug --no-daemon --stacktrace
            cp movil/app/build/outputs/apk/debug/app-debug.apk Atlas-Movil.apk
          fi
      # El paquete de la interfaz va firmado con la misma llave del APK: la app solo acepta el que trae esa firma.
      - name: Empaquetar y firmar la interfaz
        if: env.ATLAS_KEYSTORE != ''
        run: |
          (cd movil/app/src/main/assets/ui && zip -q -X -j "$GITHUB_WORKSPACE/ui.zip" *)
          export CLAVE="$ATLAS_KEYSTORE_CLAVE"
          keytool -importkeystore -srckeystore "$ATLAS_KEYSTORE" -srcstorepass:env CLAVE -srcalias atlas \
            -destkeystore "$RUNNER_TEMP/k.p12" -deststoretype PKCS12 -deststorepass:env CLAVE -destkeypass:env CLAVE -noprompt 2>/dev/null
          openssl pkcs12 -in "$RUNNER_TEMP/k.p12" -nocerts -nodes -passin env:CLAVE -out "$RUNNER_TEMP/k.pem" 2>/dev/null
          openssl pkcs12 -in "$RUNNER_TEMP/k.p12" -nokeys -passin env:CLAVE 2>/dev/null | openssl x509 -pubkey -noout > "$RUNNER_TEMP/pub.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/k.pem" -out ui.zip.sig ui.zip
          rm -f "$RUNNER_TEMP/k.pem" "$RUNNER_TEMP/k.p12"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature ui.zip.sig ui.zip
          # el mismo número que calcula build.gradle.kts a partir de movil/VERSION (1.x.y -> x*10000 + y)
          APP=$(awk -F. '{print $2 * 10000 + $3}' movil/VERSION)
          echo "{\"ui\": $UI_N, \"ui_min_app\": $UI_MIN, \"app\": $APP}" > actual.json
          cat actual.json; ls -l ui.zip ui.zip.sig
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Movil
          path: Atlas-Movil.apk
      # Deja el APK suelto en la rama apk-atlas-movil (un solo commit, se reemplaza cada vez) para bajarlo directo.
      - name: Publicar el APK en la rama apk-atlas-movil
        run: |
          mkdir salida && cp Atlas-Movil.apk salida/ && cd salida
          git init -q -b apk-atlas-movil
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in ui.zip ui.zip.sig actual.json; do [ -f "../$f" ] && cp "../$f" .; done
          git add .
          git commit -q -m "Atlas Móvil: APK compilado de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-atlas-movil
