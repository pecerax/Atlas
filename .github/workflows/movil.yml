name: Atlas Móvil

on:
  push:
    paths:
      - "movil/**"
      - "hud/atlas_puente.py"
      - "hud/pruebas_puente.py"
      - ".github/workflows/movil.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puente:
    name: Pruebas del Puente Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cryptography==50.0.2
      - run: python hud/pruebas_puente.py

  apk:
    name: Compilar el APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Con la llave de firma guardada en los secretos del repositorio, cada versión se instala sobre la anterior.
      - name: Llave de firma (si está configurada)
        env:
          LLAVE: ${{ secrets.ATLAS_KEYSTORE_B64 }}
        run: |
          if [ -n "$LLAVE" ]; then
            echo "$LLAVE" | base64 -d > "$RUNNER_TEMP/atlas.jks"
            echo "ATLAS_KEYSTORE=$RUNNER_TEMP/atlas.jks" >> "$GITHUB_ENV"
          fi
      - name: Compilar
        env:
          ATLAS_KEYSTORE_CLAVE: ${{ secrets.ATLAS_KEYSTORE_CLAVE }}
        run: gradle -p movil assembleDebug --no-daemon --stacktrace
      - run: cp movil/app/build/outputs/apk/debug/app-debug.apk Atlas-Movil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Movil
          path: Atlas-Movil.apk
